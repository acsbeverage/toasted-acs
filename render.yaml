services:
  - type: web
    name: toasted-acs
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://toasted.acsbeverageco.com
      - key: DATABASE_URL
        fromDatabase:
          name: toasted-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: accounting@acsbeverage.com
      - key: FROM_NAME
        value: Toasted — ACS Beverage Co.
      - key: NOTIFY_EMAILS
        value: kevin@acsbeverage.com,jessica@acsbeverage.com

databases:
  - name: toasted-db
    plan: free
    databaseName: toasted
